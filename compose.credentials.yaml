# Shared GitHub and Google Cloud credentials, mounted into every lab session by
# default. The launcher omits this file when AGENT_LAB_NO_CREDENTIALS=1, which
# is the right choice when pointing a lab at a repository you do not trust:
# anything running in the container can read whatever is mounted here.
services:
  project:
    volumes:
      - agent-github:/github
      - agent-gcloud:/gcloud
    environment:
      GH_CONFIG_DIR: /github/gh
      GIT_CONFIG_GLOBAL: /github/gitconfig
      CLOUDSDK_CONFIG: /gcloud
      GOOGLE_APPLICATION_CREDENTIALS: /gcloud/application_default_credentials.json

volumes:
  agent-github:
    name: agent-lab-github
    external: true
  agent-gcloud:
    name: agent-lab-gcloud
    external: true
