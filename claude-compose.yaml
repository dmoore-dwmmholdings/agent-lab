# Claude Lab base definition. Shares the unified Dockerfile with Codex Lab; only
# the agent package, the unprivileged user, and the auto-updater differ.
#
# The launcher always passes an explicit `-p` project name, which determines the
# built image tag. Do not rely on the `name:` below for image naming.
name: claude-lab

services:
  project:
    build:
      context: .
      args:
        AGENT_PACKAGE: "@anthropic-ai/claude-code"
        LAB_USER: claude
        DISABLE_AUTOUPDATER: "1"
    init: true
    working_dir: ${WORKSPACE_DIR:-/workspace/project}
    volumes:
      - type: bind
        source: ${PROJECT_DIR:?Set PROJECT_DIR to the project folder you want Claude to access}
        target: ${WORKSPACE_DIR:-/workspace/project}
      - claude-home:/home/claude
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: ${AGENT_LAB_PIDS_LIMIT:-4096}
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=1g
    environment:
      HOME: /home/claude
      AGENT_LAB_USER: claude
      # Documented opt-out of the manifest approval prompt; it has to be
      # forwarded explicitly or the entrypoint never sees it.
      AGENT_LAB_TRUST_MANIFEST: ${AGENT_LAB_TRUST_MANIFEST:-}
      TERM: ${TERM:-xterm-256color}
      DISABLE_AUTOUPDATER: "1"
    stdin_open: true
    tty: true

volumes:
  claude-home:
    name: claude-lab-home
    external: true
