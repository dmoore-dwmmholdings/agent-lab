# Codex Lab base definition.
#
# The launcher always passes an explicit `-p` project name, which determines the
# built image tag. Do not rely on the `name:` below for image naming.
name: codex-lab

services:
  project:
    build:
      context: .
      args:
        AGENT_PACKAGE: "@openai/codex"
        LAB_USER: codex
    init: true
    working_dir: ${WORKSPACE_DIR:-/workspace/project}
    volumes:
      # This is the only host folder that Codex can modify.
      - type: bind
        source: ${PROJECT_DIR:?Set PROJECT_DIR to the project folder you want Codex to access}
        target: ${WORKSPACE_DIR:-/workspace/project}
      # Docker-managed state: login credentials and portable MCP configuration.
      # This is not a host-directory mount.
      - codex-home:/home/codex
    # Do not add the Docker socket, a home-directory mount, or privileged mode.
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    # Backstop against a runaway agent or build forking without limit.
    pids_limit: ${AGENT_LAB_PIDS_LIMIT:-4096}
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=1g
    environment:
      HOME: /home/codex
      AGENT_LAB_USER: codex
      # Documented opt-out of the manifest approval prompt; it has to be
      # forwarded explicitly or the entrypoint never sees it.
      AGENT_LAB_TRUST_MANIFEST: ${AGENT_LAB_TRUST_MANIFEST:-}
      TERM: ${TERM:-xterm-256color}
    stdin_open: true
    tty: true

volumes:
  codex-home:
    name: codex-lab-home
    external: true
